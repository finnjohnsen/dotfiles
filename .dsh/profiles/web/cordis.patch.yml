# Profile-local patch — applied after the dsh-base + dsh-web-app bundle patches.
# Adds z.ai MCP servers (web search + web reader) over streamable-http. Each
# server's tools surface to the model as mcp__<serverName>__<rawName>.
#
# The Authorization header is the RAW z.ai API key (no "Bearer" prefix),
# resolved from process.env.Z_AI_API_KEY. MCP `!!js process.env.*` expressions
# read ONLY process.env — not .credentials.yaml — so the key must also be
# present in ~/.dsh/.env (see .env.example) for these to authenticate.
# HMR is disabled in the web profile, so restart `dsh web` to load this patch.
- insert:
    - id: mcp-zai-web-search
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: zai-web-search
        transport: streamable-http
        url: https://api.z.ai/api/mcp/web_search_prime/mcp
        headers:
          Authorization: !!js process.env.Z_AI_API_KEY

    - id: mcp-zai-web-reader
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: zai-web-reader
        transport: streamable-http
        url: https://api.z.ai/api/mcp/web_reader/mcp
        headers:
          Authorization: !!js process.env.Z_AI_API_KEY
